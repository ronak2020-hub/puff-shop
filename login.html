<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Puff Delight</title>
  
  <!-- Font Awesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page-body">

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <a href="index.html" class="brand-logo">
          <i class="fas fa-bread-slice"></i>
          <span>Puff Delight</span>
        </a>
        <p>Welcome back! Login to your account to order your favorite puffs and track orders.</p>
      </div>

      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="login-email">Email Address *</label>
          <input type="email" id="login-email" class="form-control" placeholder="enter your email" required autocomplete="email">
        </div>

        <div class="form-group">
          <label for="login-password">Password *</label>
          <input type="password" id="login-password" class="form-control" placeholder="enter your password" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem; padding: 0.9rem;">
          <i class="fas fa-sign-in-alt"></i> Login
        </button>
      </form>

      <div class="auth-footer-text">
        Don't have an account yet? <a href="register.html">Create Account</a>
      </div>
      <div style="text-align: center; margin-top: 1rem;">
        <a href="index.html" style="font-size: 0.88rem; color: var(--primary-brown);"><i class="fas fa-arrow-left"></i> Back to Home</a>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
