<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | Puff Delight</title>
  
  <!-- Font Awesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page-body">

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <a href="index.html" class="brand-logo">
          <i class="fas fa-bread-slice"></i>
          <span>Puff Delight</span>
        </a>
        <p>Create a new account to start ordering crispy delicious puffs!</p>
      </div>

      <form onsubmit="handleRegister(event)">
        <div class="form-group">
          <label for="reg-email">Email Address *</label>
          <input type="email" id="reg-email" class="form-control" placeholder="john@example.com" required autocomplete="email">
        </div>
        
        <div class="form-group">
          <label for="reg-password">Password *</label>
          <input type="password" id="reg-password" class="form-control" placeholder="Create a password" required minlength="4">
        </div>

        <div class="form-group">
          <label for="reg-confirm-password">Confirm Password *</label>
          <input type="password" id="reg-confirm-password" class="form-control" placeholder="Confirm your password" required minlength="4">
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem; padding: 0.9rem;">
          <i class="fas fa-user-plus"></i> Create Account
        </button>
      </form>

      <div class="auth-footer-text">
        Already have an account? <a href="login.html">Login Here</a>
      </div>
      <div style="text-align: center; margin-top: 1rem;">
        <a href="index.html" style="font-size: 0.88rem; color: var(--primary-brown);"><i class="fas fa-arrow-left"></i> Back to Home</a>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
